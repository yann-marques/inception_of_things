apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
spec:
  selector:
    matchLabels: 
      app: app1
  replicas: 1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1
        command: ["/data/scripts/launcher.sh"]
        image: openeuler/next
        env:
          - name: APP_NAME
            value: "app1"
        ports:
        - containerPort: 3000
        volumeMounts:
          - name: config-vol
            mountPath: /data
      volumes:
        - name: config-vol
          hostPath:
            path: /data
            type: Directory
