apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
# ---------- PostgreSQL ----------
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-postgresql-password   # = global.psql.password.secret
  namespace: gitlab
type: Opaque
stringData:
  password: "Coucou1234?"            # = global.psql.password.key
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: gitlab
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:17
      args: ["-c", "max_locks_per_transaction=512"]   # defaut 64
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER        # = global.psql.username
          value: gitlab
        - name: POSTGRES_DB          # = global.psql.database
          value: gitlabhq_production
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitlab-postgresql-password
              key: password
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi
  volumes:
    - name: pgdata
      emptyDir: {}   # remplacer par un PVC pour la persistance
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql                   # = global.psql.host
  namespace: gitlab
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
# ---------- Redis ----------
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-redis-password        # = global.redis.auth.secret
  namespace: gitlab
type: Opaque
stringData:
  password: "Coucou1234?"            # = global.redis.auth.key
---
apiVersion: v1
kind: Pod
metadata:
  name: redis
  namespace: gitlab
  labels:
    app: redis
spec:
  containers:
    - name: redis
      image: redis:7
      command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
      env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gitlab-redis-password
              key: password
      ports:
        - containerPort: 6379
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis                        # = global.redis.host
  namespace: gitlab
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# ---------- MinIO ----------
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-minio-secret
  namespace: gitlab
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: "Coucou1234?"
---
apiVersion: v1
kind: Pod
metadata:
  name: minio
  namespace: gitlab
  labels:
    app: minio
spec:
  containers:
    - name: minio
      image: elestio/minio
      args:
        - server
        - /data
        - --console-address
        - ":9001"
      ports:
        - containerPort: 9000   # API S3
        - containerPort: 9001   # console web
      envFrom:
        - secretRef:
            name: gitlab-minio-secret
      volumeMounts:
        - name: miniodata
          mountPath: /data
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
  volumes:
    - name: miniodata
      emptyDir: {}   # remplacer par un PVC pour la persistance
---
apiVersion: v1
kind: Service
metadata:
  name: minio                        # = host/endpoint dans gitlab-minio-connection
  namespace: gitlab
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: gitlab
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: elestio/minio         # meme image que le pod minio, elle contient le client mc
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              # = buckets artifacts, uploads et externalDiffs de global.appConfig
              mc mb --ignore-existing local/gitlab-artifacts local/gitlab-uploads local/gitlab-mr-diffs
          envFrom:
            - secretRef:
                name: gitlab-minio-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-minio-connection      # = global.appConfig.object_store.connection.secret
  namespace: gitlab
type: Opaque
stringData:
  connection: |                      # = connection.key
    provider: AWS
    region: us-east-1
    aws_access_key_id: minioadmin
    aws_secret_access_key: Coucou1234?
    aws_signature_version: 4
    host: minio
    endpoint: "http://minio:9000"
    path_style: true
